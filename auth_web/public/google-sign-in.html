<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>OpenStructures — Google sign-in</title>
  <link rel="icon" type="image/png" href="./logo.png">
  <link rel="stylesheet" href="./login.css">
  <script type="module" src="./login.js"></script>
</head>
<body>
  <main>
    <div class="brand">
      <img src="./logo.png" width="48" height="48" alt="">
      <span>Open//Structures</span>
    </div>
    <h1>Sign in with Google</h1>
    <p>Your account connects to OpenStructures. Your models and calculations stay on your computer.</p>
    <button id="signin" disabled>Continue with Google</button>
    <p id="status" role="status" aria-live="polite">Preparing sign-in…</p>
    <p class="hint">Open this page from the Google sign-in button in OpenStructures.</p>
  </main>
</body>
</html>
